<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evilginx Dashboard</title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex">
  <aside class="w-[240px] bg-gray-900 text-white flex-shrink-0 flex flex-col min-h-screen">
    <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-700">
      <div class="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center">
        <i class="fa-solid fa-fish text-sm"></i>
      </div>
      <span class="text-lg font-bold tracking-wide">Evilginx</span>
    </div>
    <nav class="flex-1 px-4 py-6 space-y-1">
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-gray-800 text-white text-sm font-medium">
        <i class="fa-solid fa-gauge-high w-5 text-center"></i> Dashboard
      </a>
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 text-sm transition">
        <i class="fa-solid fa-bullhorn w-5 text-center"></i> Campaigns
      </a>
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 text-sm transition">
        <i class="fa-solid fa-key w-5 text-center"></i> Credentials
      </a>
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 text-sm transition">
        <i class="fa-solid fa-cookie-bite w-5 text-center"></i> Cookies
      </a>
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 text-sm transition">
        <i class="fa-solid fa-gear w-5 text-center"></i> Settings
      </a>
    </nav>
    <div class="px-4 py-4 border-t border-gray-700">
      <div class="flex items-center gap-3 text-sm text-gray-400">
        <i class="fa-solid fa-circle text-green-400 text-[8px]"></i>
        <span>System Online</span>
      </div>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-h-screen">
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
      <h1 class="text-xl font-semibold text-gray-800">Dashboard</h1>
      <div class="flex items-center gap-4">
        <button class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition">
          <i class="fa-regular fa-bell"></i>
        </button>
        <div class="w-9 h-9 rounded-full bg-gray-800 flex items-center justify-center text-white text-sm font-medium">
          AD
        </div>
      </div>
    </header>

    <main class="flex-1 p-6 overflow-auto">
      <div id="statsRow1" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 mb-6"></div>

      <div id="statsRow2" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6"></div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-200">
        <div class="p-4 border-b border-gray-100">
          <div class="relative max-w-xs">
            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="text" id="searchInput" placeholder="Search..." class="w-full pl-9 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-gray-50">
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="bg-gray-800 text-white">
                <th class="text-left py-3 px-4 font-semibold">ID</th>
                <th class="text-left py-3 px-4 font-semibold">Campaign</th>
                <th class="text-left py-3 px-4 font-semibold">Target</th>
                <th class="text-left py-3 px-4 font-semibold">User</th>
                <th class="text-left py-3 px-4 font-semibold">Pass</th>
                <th class="text-left py-3 px-4 font-semibold">Cookies</th>
                <th class="text-left py-3 px-4 font-semibold">IP</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    const mockData = [
      { id: 387, campaign: "YAHOO 01", target: "YAHOO", user: "braxtonwinterstrucking@yahoo.com", pass: "Pugbug9699#", cookies: "2600:8803:8903:5400:443:...", ip: "192.168.1.45" },
      { id: 388, campaign: "GOOGLE 02", target: "GOOGLE", user: "john.doe@gmail.com", pass: "SecurePass123!", cookies: "session=abc123xyz...", ip: "10.0.0.5" },
      { id: 389, campaign: "MICROSOFT 01", target: "OUTLOOK", user: "alice.wonderland@outlook.com", pass: "Wonderland#2024", cookies: "MSAuth=token789...", ip: "172.16.0.10" },
      { id: 390, campaign: "YAHOO 01", target: "YAHOO", user: "support@techcorp.net", pass: "TechCorp2024!", cookies: "2600:8803:8903:5400:444:...", ip: "203.0.113.22" }
    ];

    const campaignColors = {
      YAHOO: 'bg-purple-100 text-purple-700',
      GOOGLE: 'bg-blue-100 text-blue-700',
      MICROSOFT: 'bg-green-100 text-green-700'
    };

    let tableData = [];

    function truncate(str, len) {
      if (!str) return '-';
      return str.length > len ? str.slice(0, len) + '...' : str;
    }

    function getCampaignClass(campaign) {
      const c = (campaign || '').toUpperCase();
      for (const key of Object.keys(campaignColors)) {
        if (c.startsWith(key)) return campaignColors[key];
      }
      return 'bg-gray-100 text-gray-700';
    }

    function buildStats1(sessions) {
      const total = sessions.length;
      const today = sessions.filter(s => {
        const d = new Date(s.create_time * 1000);
        const now = new Date();
        return d.toDateString() === now.toDateString();
      }).length;
      const withCreds = sessions.filter(s => s.username || s.password).length;
      const withCookies = sessions.filter(s => s.tokens && Object.keys(s.tokens).length > 0).length;

      const cards = [
        { icon: 'globe', color: 'bg-blue-50 text-blue-600', label: 'Total Visits', val: total.toLocaleString() },
        { icon: 'clock', color: 'bg-green-50 text-green-600', label: 'Visits Today', val: today.toLocaleString() },
        { icon: 'bullhorn', color: 'bg-purple-50 text-purple-600', label: 'Campaigns Today', val: '0' },
        { icon: 'key', color: 'bg-amber-50 text-amber-600', label: 'Credentials Today', val: withCreds.toLocaleString() },
        { icon: 'cookie-bite', color: 'bg-rose-50 text-rose-600', label: 'Cookies Today', val: withCookies.toLocaleString() }
      ];

      document.getElementById('statsRow1').innerHTML = cards.map(c => `
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex items-center gap-4">
          <div class="w-11 h-11 rounded-lg ${c.color} flex items-center justify-center"><i class="fa-solid fa-${c.icon} text-lg"></i></div>
          <div>
            <p class="text-xs text-gray-500 uppercase tracking-wide font-medium">${c.label}</p>
            <p class="text-2xl font-bold text-gray-800">${c.val}</p>
          </div>
        </div>
      `).join('');
    }

    function buildStats2(sessions) {
      const phishlets = new Set(sessions.map(s => s.phishlet));
      const withCreds = sessions.filter(s => s.username || s.password).length;
      const withCookies = sessions.filter(s => s.tokens && Object.keys(s.tokens).length > 0).length;

      const cards = [
        { icon: 'bullhorn', color: 'bg-indigo-50 text-indigo-600', bar: 'bg-indigo-500', label: 'Total Campaigns', val: phishlets.size.toLocaleString(), pct: Math.min(phishlets.size * 10, 100) },
        { icon: 'key', color: 'bg-emerald-50 text-emerald-600', bar: 'bg-emerald-500', label: 'Total Credentials', val: withCreds.toLocaleString(), pct: Math.min(withCreds * 5, 100) },
        { icon: 'cookie-bite', color: 'bg-rose-50 text-rose-600', bar: 'bg-rose-500', label: 'Total Cookies', val: withCookies.toLocaleString(), pct: Math.min(withCookies * 5, 100) }
      ];

      document.getElementById('statsRow2').innerHTML = cards.map(c => `
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
          <div class="flex items-center gap-3 mb-1">
            <div class="w-10 h-10 rounded-lg ${c.color} flex items-center justify-center"><i class="fa-solid fa-${c.icon}"></i></div>
            <div>
              <p class="text-sm text-gray-500 font-medium">${c.label}</p>
              <p class="text-3xl font-bold text-gray-800">${c.val}</p>
            </div>
          </div>
          <div class="mt-3 h-1.5 bg-gray-100 rounded-full overflow-hidden"><div class="h-full ${c.bar} rounded-full" style="width:${c.pct}%"></div></div>
        </div>
      `).join('');
    }

    function camelToSnake(str) {
      return str.replace(/[A-Z]/g, c => '_' + c.toLowerCase());
    }

    function flattenTokens(tokens) {
      if (!tokens) return '-';
      const parts = [];
      for (const [domain, tmap] of Object.entries(tokens)) {
        for (const [key, val] of Object.entries(tmap)) {
          parts.push(`${key}=${val.value ? val.value.slice(0, 30) : ''}`);
        }
      }
      return parts.join('; ') || '-';
    }

    function bitbBadge(bitb) {
      if (!bitb) return '';
      if (bitb.status === 'logging_in') return '<span class="inline-block ml-1 px-1.5 py-0.5 rounded text-[9px] font-bold bg-yellow-100 text-yellow-700" title="BITB login in progress">BITB</span>';
      if (bitb.status === 'complete') return '<span class="inline-block ml-1 px-1.5 py-0.5 rounded text-[9px] font-bold bg-green-100 text-green-700" title="' + (bitb.cookie_count || 0) + ' cookies captured via BITB">BITB</span>';
      if (bitb.status === 'failed') return '<span class="inline-block ml-1 px-1.5 py-0.5 rounded text-[9px] font-bold bg-red-100 text-red-700" title="BITB login failed">BITB</span>';
      return '';
    }

    function render(rows) {
      tableData = rows;
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = rows.map((row, i) => `
        <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-50 transition cursor-pointer border-b border-gray-100">
          <td class="py-3 px-4 text-gray-800 font-medium">${row.id}</td>
          <td class="py-3 px-4"><span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold ${getCampaignClass(row.phishlet || row.campaign)}">${row.campaign || row.phishlet || '-'}</span>${bitbBadge(row.bitb)}</td>
          <td class="py-3 px-4 text-gray-600">${row.target || '-'}</td>
          <td class="py-3 px-4 text-gray-700 max-w-[200px] truncate" title="${row.username || row.user || ''}">${row.username || row.user || '-'}</td>
          <td class="py-3 px-4 text-gray-700 font-mono text-xs max-w-[140px] truncate" title="${row.password || row.pass || ''}">${row.password || row.pass || '-'}</td>
          <td class="py-3 px-4 text-gray-500 font-mono text-xs" title="${row.cookies_raw || ''}">${truncate(row.cookies_raw || row.cookies, 20)}</td>
          <td class="py-3 px-4 text-gray-600 font-mono text-xs">${row.remote_addr || row.ip || '-'}</td>
        </tr>
      `).join('');
    }

    function filterTable(q) {
      if (!q) { render(tableData); return; }
      const filtered = tableData.filter(row =>
        String(row.id).includes(q) ||
        (row.campaign || row.phishlet || '').toLowerCase().includes(q) ||
        (row.target || '').toLowerCase().includes(q) ||
        (row.username || row.user || '').toLowerCase().includes(q) ||
        (row.password || row.pass || '').toLowerCase().includes(q) ||
        (row.cookies_raw || row.cookies || '').toLowerCase().includes(q) ||
        (row.remote_addr || row.ip || '').toLowerCase().includes(q)
      );
      render(filtered);
    }

    let bitbSessionStatus = {};

    async function checkBitbStatus(sid) {
      try {
        const res = await fetch('/bitb/status/' + encodeURIComponent(sid));
        if (!res.ok) return null;
        return await res.json();
      } catch(e) {
        return null;
      }
    }

    async function fetchBitbCookies(sid) {
      try {
        const res = await fetch('/bitb/cookies/' + encodeURIComponent(sid));
        if (!res.ok) return null;
        return await res.json();
      } catch(e) {
        return null;
      }
    }

    async function loadData() {
      const params = new URLSearchParams(window.location.search);
      let auth = params.get('auth') || '';
      if (!auth) {
        auth = '__AUTH_TOKEN__';
        if (auth === '__AUTH_TOKEN__') auth = '';
      }

      try {
        const url = auth ? `/api/sessions?auth=${encodeURIComponent(auth)}` : '/api/sessions';
        const res = await fetch(url);
        if (!res.ok) throw new Error('API returned ' + res.status);
        const json = await res.json();
        const sessions = json.sessions || [];

        const rows = sessions.map(s => ({
          id: s.id,
          campaign: s.phishlet || '-',
          target: (s.phishlet || '').split(' ')[0] || '-',
          username: s.username || '',
          password: s.password || '',
          cookies_raw: flattenTokens(s.tokens),
          remote_addr: s.remote_addr || '',
          create_time: s.create_time,
          useragent: s.useragent || '',
          landing_url: s.landing_url || '',
          bitb: bitbSessionStatus[s.id] || null
        }));

        buildStats1(sessions);
        buildStats2(sessions);
        render(rows);

        sessions.forEach(function(s) {
          if (!bitbSessionStatus[s.id] || bitbSessionStatus[s.id].status === 'logging_in') {
            checkBitbStatus(s.id).then(function(status) {
              if (status) {
                bitbSessionStatus[s.id] = status;
                if (status.status === 'complete') {
                  fetchBitbCookies(s.id).then(function(cd) {
                    if (cd && cd.cookies) {
                      var extra = '';
                      cd.cookies.forEach(function(c) {
                        extra += c.name + '=' + c.value.substring(0, 30) + '... ';
                      });
                    }
                    loadData();
                  });
                }
              }
            });
          }
        });
      } catch (e) {
        console.warn('API unavailable, using mock data:', e.message);
        buildStats1(mockData);
        buildStats2(mockData);
        render(mockData);
      }
    }

    document.addEventListener('DOMContentLoaded', loadData);
    setInterval(loadData, 10000);

    document.getElementById('searchInput').addEventListener('input', function() {
      filterTable(this.value.toLowerCase().trim());
    });
  </script>
</body>
</html>
