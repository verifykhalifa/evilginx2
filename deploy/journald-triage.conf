# journald persistent storage — so evilginx crash logs survive reboots.
# Place at /etc/systemd/journald.conf.d/evilginx-triage.conf
[Journal]
Storage=persistent
# evilginx console is chatty (every proxied asset = a line). Don't let it
# flood the journal; 10k lines/s cap is way above real traffic anyway.
RateLimitIntervalSec=5s
RateLimitBurst=10000
Compress=yes
