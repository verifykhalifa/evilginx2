<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 2rem; max-width: 400px; color: white; }
        .icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.9; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; font-weight: 300; }
        p { font-size: 1.1rem; opacity: 0.8; line-height: 1.5; }
        .progress { margin-top: 2rem; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: white; animation: load 2s ease-in-out infinite; }
        @keyframes load { 0% { width: 0%; margin-left: 0; } 50% { width: 50%; margin-left: 0; } 100% { width: 0%; margin-left: 100%; } }
        .contact { margin-top: 2rem; font-size: 0.9rem; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>Site Under Construction</h1>
        <p>We're working hard to bring you something great. Please check back soon!</p>
        <div class="progress"><div class="progress-bar"></div></div>
        <div class="contact">Questions? Contact us at <a href="mailto:admin@example.com" style="color:inherit;text-decoration:underline;">admin@example.com</a></div>
    </div>
</body>
</html>
